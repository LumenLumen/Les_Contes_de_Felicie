<div class="image-wrapper" (click)="revealSpoiler()">
    <img 
        [src]="img" 
        [alt]="alt" 
        [class.blurred]="spoiler && !isRevealed">

    @if (spoiler && !isRevealed) {
        <div class="spoiler-overlay">
        <span class="warning-badge">Contenu sensible<br>Sensitive content</span>
        <span class="instruction">Cliquer pour afficher<br>Click to show</span>
        </div>
    }

    <span class="tooltip-text">Made by <a [href]="lien">{{artist}}</a></span>
</div>
