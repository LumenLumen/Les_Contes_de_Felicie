<div class="card">
    <app-flexbox sidePosition="left">
        <div side>
            <app-image img="{{image_path}}" alt="{{artist}}" artist="{{artist}}" height="300px"></app-image>
        </div>
        <div content>
            <p>Surnom :        {{char?.surnom}}</p>
            <p>Prononciation : {{char?.prononciation}}</p>
            <p>Pronoms :       {{char?.pronom}}</p>
            <p>Anniversaire :  {{char?.birthday}}</p>
            <p>Sexualité :     {{char?.sexuality}}</p>
            <p>Métiers :       {{char?.job}}</p>
        </div>
    </app-flexbox>
</div>
