<app-langtab>
    <div lang-en>
        <app-encadre age="981 years old" size="6.4 ft (human) | 39.4 ft (dragon)" 
            desc="Médien is a teacher at the orphanage, having previously worked as a shoemaker. He is also the protective dragon of Chapelle d’Orée, a fact he keeps completely hidden.">
        </app-encadre>
        <app-bulletlist titre="MAGIC" [items]="[
            'Médien is gifted with a powerful magic that he keeps concealed. He can trace golden lines around himself to draw shapes or symbols, using them notably to create seals. When he lets his magic run free, it turns bright magenta.'
            ]">
        </app-bulletlist>
        <app-bulletlist titre="NOTES" [items]="[
            'Médien appears to be a calm, collected, and friendly person. However, he is very reserved and rarely speaks about himself. He may intentionally remain vague or leave things unsaid because he is a very poor liar.', 
            'He is rather anxious and takes his responsibilities very seriously. He occasionally smokes to calm his stress. He does not consume alcohol, as he cannot digest it.',
            'Médien gets sick often; he is sensitive to the cold and to germs.',
            'Médien enjoys company; he readily chats with people and has no trouble meeting new acquaintances. Nevertheless, he still needs moments of solitude and his little daily routines.',
            'He is highly knowledgeable in many fields, as his long life has given him the opportunity to experience many things. He sometimes struggles to tone down his intellect to avoid looking too suspicious.',
            'He does not handle physical contact well and can react abruptly if startled.',
            'Médien wishes to live as a human and hides his draconic form at all costs.'
            ]">
        </app-bulletlist>
        <app-bulletlist titre="IDEAS" [items]="[
            'Médien scaling a fish. He enjoys cooking and is good at it.', 
            'Médien smoking by a window or sitting on some steps outside, watching the scenery. He avoids smoking in front of others.',
            'Médien and Zorigaitza over a drink, discussing the history of the city.',
            'Médien showing a few sewing tips to any child from the orphanage.',
            'Médien feasting together with his colleagues from the orphanage. Inhabitants of the herbalist shop can be present as well.',
            'Médien is sick. Linja, Buster, or Verveine are giving him a brew to help him recover.',
            'Médien, threatening, fiercely showing his fangs in his draconic form, letting his red magic escape all around him.'
            ]">
        </app-bulletlist>
        <br>
        <app-flexbox sidePosition="left">
            <div side>
                <app-image img="assets/Medien/newni.png" alt="Référence" artist="Newni"></app-image>
            </div>
            <div content>
                <app-bulletlist titre="TEACHER OUTFIT" [items]="[
                    'He wears this outfit when he is at the orphanage.',
                    'When winter comes, he wears long sleeves and eventually a coat.',
                    ]">
                </app-bulletlist>
            </div>
        </app-flexbox>
        <app-flexbox sidePosition="left">
            <div side>
                <app-image img="assets/Medien/newni2.png" alt="Référence" artist="Newni"></app-image>
            </div>
            <div content>
                <app-bulletlist titre="DAILY OUTFIT" [items]="[
                    'He wears this outfit when he is not working.',
                    'His hairstyle can be changed; when he has time, he likes to experiment with his appearance.',
                    'You can also add makeup to his look!'
                    ]">
                </app-bulletlist>
            </div>
        </app-flexbox>
        <app-flexbox sidePosition="left">
            <div side>
                <app-image img="assets/Medien/newni3.png" alt="Référence" artist="Newni"></app-image>
            </div>
            <div content>
                <app-bulletlist titre="CASUAL OUTFIT" [items]="[
                    'He wears this outfit when he is at home and not expecting visitors.'
                    ]">
                </app-bulletlist>
            </div>
        </app-flexbox>
        <app-flexbox sidePosition="left">
            <div side>
                <app-image img="assets/Medien/newni4.png" alt="Référence" artist="Newni"></app-image>
            </div>
            <div content>
                <app-bulletlist titre="CRAFTMAN OUTFIT" [items]="[
                    'He was wearing this ouftit when he was a shoemaker. He still wears from time to time when he is showing some manual works to the children of the orphanage.',
                    'You can add some dust or scratches to his outfit.'
                    ]">
                </app-bulletlist>
            </div>
        </app-flexbox>
    </div>

    <div lang-fr>
        <app-encadre age="981 ans" size="192 cm (humain) | 1200 cm (dragon)" 
            desc="Médien est professeur à l'orphelinat après avoir été cordonnier. Il est également le dragon protecteur de Chapelle d'Orée, ce qu'il cache complètement.">
        </app-encadre>
        <app-bulletlist titre="MAGIE" [items]="[
            'Médien est doué d\'une puissante magie qu\'il cache. Il peut tracer des lignes dorées autour de lui pour dessiner des formes ou des symboles. Il s\'en sert notamment pour créer des sceaux. Lorsqu\'il laisse libre cours à sa magie, elle devient magenta vif.'
            ]">
        </app-bulletlist>
        <app-bulletlist titre="NOTES" [items]="[
            'Médien est quelqu\'un de calme, posé et sympathique en apparence. Il est cependant très réservé et parle peu de lui. Il peut volontairement rester vague ou laisser des non-dits à son sujet car il ment très mal.', 
            'Il est plutôt anxieux et prend les responsabilités très à cœur. Il fume occasionnellement pour calmer son stress. Il ne consomme pas d\'alcool, il ne le digère pas.',
            'Médien est souvent malade, il est sensible au froid et aux microbes.',
            'Médien aime la compagnie, il discute volontiers avec les gens et rencontre sans souci de nouvelles personnes. Il a malgré tout besoin de moments de solitude et de ses petites habitudes.',
            'Médien est très cultivé dans de nombreux domaines, sa longue vie lui a donné l\'occasion d\'expérimenter beaucoup de choses. Il a parfois du mal à baisser son niveau pour ne pas paraître trop louche.',
            'Il accepte mal les contacts physiques et peut avoir des réactions brusques s\'il est surpris.',
            'Médien souhaite vivre comme un humain et il cache sa forme draconique à tout prix.'
            ]">
        </app-bulletlist>
        <app-bulletlist titre="IDÉES" [items]="[
            'Médien écaille un poisson. Il apprécie cuisiner et il le fait bien.', 
            'Médien fume à une fenêtre ou assis sur des marches à l’extérieur, observant le paysage. Il évite de fumer devant les autres.',
            'Médien et Zorigaitza autour d’un verre en train de discuter de l’histoire de la ville.',
            'Médien montrant quelques astuces de couture à un enfant de l’orphelinat.',
            'Médien festoyant avec ses collègues de l’orphelinat. Les habitants de l’herboristerie peuvent être présents également.',
            'Médien est malade. Linja, Buster ou Verveine lui donnent une potion pour l’aider à se rétablir.',
            'Médien, menaçant, montrant férocement ses crocs dans sa forme draconique, laissant sa magie rouge s’échapper tout autour de lui.'
            ]">
        </app-bulletlist>
        <br>
        <app-flexbox sidePosition="left">
            <div side>
                <app-image img="assets/Medien/newni.png" alt="Référence" artist="Newni"></app-image>
            </div>
            <div content>
                <app-bulletlist titre="TENUE DE PROFESSEUR" [items]="[
                    'Il porte cette tenue lorsqu’il est à l’orphelinat.',
                    'Quand l’hiver arrive, il porte des manches longues et éventuellement un manteau.',
                    ]">
                </app-bulletlist>
            </div>
        </app-flexbox>
        <app-flexbox sidePosition="left">

            <div content>
                <app-bulletlist titre="TENUE QUOTIDIENNE" [items]="[
                    'Il porte cette tenue lorsqu’il n’est pas au travail.',
                    'Sa coiffure peut être modifiée ; lorsqu’il a le temps, il aime expérimenter avec son apparence.',
                    'Vous pouvez également ajouter du maquillage à son look !'
                    ]">
                </app-bulletlist>
            </div>
        </app-flexbox>
        <app-flexbox sidePosition="left">
            <div side>
                <app-image img="assets/Medien/newni3.png" alt="Référence" artist="Newni"></app-image>
            </div>
            <div content>
                <app-bulletlist titre="PYJAMA" [items]="[
                    'Il porte cette tenue lorsqu’il est chez lui et qu’il n’attend pas de visite.'
                    ]">
                </app-bulletlist>
            </div>
        </app-flexbox>
        <app-flexbox sidePosition="left">
            <div side>
                <app-image img="assets/Medien/newni4.png" alt="Référence" artist="Newni"></app-image>
            </div>
            <div content>
                <app-bulletlist titre="CRAFTMAN OUTFIT" [items]="[
                    'He was wearing this ouftit when he was a shoemaker. He still wears from time to time when he is showing some manual works to the children of the orphanage.',
                    'You can add some dust or scratches to his outfit.'
                    ]">
                </app-bulletlist>
            </div>
        </app-flexbox>
    </div>
</app-langtab>
