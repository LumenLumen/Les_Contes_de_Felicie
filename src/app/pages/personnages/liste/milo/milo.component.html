<app-backarrow></app-backarrow>
<app-popup [warningIds]="[]"></app-popup>
<app-image img="assets/Milo/para_d0xical.jpg" alt="header" artist="para_d0xical"></app-image>

<app-langtab>
    <div lang-en>
        <app-encadre age="17 years old" size="5.10 ft" 
            desc="Milo is a young werecat who aims to become a baker. He is currently training with a local baker in town and should leave the orphanage in a few months. He is in a relationship with Azur.">
        </app-encadre>
        <app-bulletlist titre="MAGIC" [items]="[
            'Milo has nine lives. They are symbolized by spectral flames (they do not burn and look like will-o\'-the-wisps) that he can make appear around him.'
            ]">
        </app-bulletlist>
        <app-bulletlist titre="NOTES" [items]="[
            'Milo is a very kind person and tends to get walked all over quite easily. He is friends with Azken, Thoo, Azur, and Félix; he acts a bit like the glue of the group.', 
            'He is meticulous in all his tasks, even if it might take him some time. He lacks self-confidence and needs to be praised or encouraged from time to time to feel reassured.',
            'He was bullied during his adolescence because of his short stature (at the time) and a voice that was late to break.'
            ]">
        </app-bulletlist>
        <app-bulletlist titre="IDEAS" [items]="[
            'Milo observing the starry night sky, pensive. He can be accompanied by Azur.', 
            'Milo preparing bread. This can be the stage of your choice. He wears an apron or the necessary equipment.',
            'Milo playing with his magical flames.'
            ]">
        </app-bulletlist>
        <br>
        <app-flexbox sidePosition="left">
            <div side>
                <app-image img="assets/Milo/newni.png" alt="Référence" artist="Newni"></app-image>
            </div>
            <div content>
                <app-bulletlist titre="HUMAN FORM" [items]="[
                    'Milo has slit eyes like a cat, even in his human form.', 
                    'The heart patterns were knitted by Azur.'
                    ]">
                </app-bulletlist>
            </div>
        </app-flexbox>
        <app-flexbox sidePosition="left">
            <div side>
                <app-image img="assets/Milo/newni2.png" alt="Référence" artist="Newni"></app-image>
            </div>
            <div content>
                <app-bulletlist titre="FERAL FORM" [items]="[
                    
                    ]">
                </app-bulletlist>
            </div>
        </app-flexbox>
    </div>

    <div lang-fr>
        <app-encadre age="17 ans" size="178 cm" 
            desc="Milo est un jeune chat-garou qui se destine au métier de boulanger. Il suit une formation auprès de l'un d'eux en ville et devrait quitter l'orphelinat dans quelques mois. Il est en couple avec Azur.">
        </app-encadre>
        <app-bulletlist titre="MAGIE" [items]="[
            'Milo a neuf vies. Elles sont symbolisées par des flammes spectrales (elles ne brûlent pas et sont semblables à des feux follets) qu\'il peut faire apparaître autour de lui.'
            ]">
        </app-bulletlist>
        <app-bulletlist titre="NOTES" [items]="[
            'Milo est quelqu\'un de très gentil et il a tendance à se faire marcher dessus assez facilement. Il est ami avec Azken, Thoo, Azur et Félix ; et c\'est un peu la colle du groupe.', 
            'Il est minutieux dans toutes ses tâches, même si cela peut lui prendre du temps. Il manque de confiance en lui et a besoin d\'être félicité ou encouragé de temps en temps pour se rassurer.',
            'Il a été harcelé à l\'adolescence à cause de sa petite taille (à l\'époque) et d\'une voix qui tardait à muer.'
            ]">
        </app-bulletlist>
        <app-bulletlist titre="IDÉES" [items]="[
            'Milo observe la nuit étoilée, pensif. Il peut être accompagné d\'Azur.', 
            'Milo prépare le pain. Cela peut être l\'étape de votre choix. Il porte un tablier ou l\'équipement nécessaire.',
            'Milo joue avec ses flammes magiques.'
            ]">
        </app-bulletlist>
        <br>
        <app-flexbox sidePosition="left">
            <div side>
                <app-image img="assets/Milo/newni.png" alt="Référence" artist="Newni"></app-image>
            </div>
            <div content>
                <app-bulletlist titre="FORME HUMAINE" [items]="[
                    'Milo a les yeux fendus comme ceux d\'un chat, même sous sa forme humaine.', 
                    'Les motifs en forme de cœur de son vêtement ont été cousus par Azur.'
                    ]">
                </app-bulletlist>
            </div>
        </app-flexbox>
        <app-flexbox sidePosition="left">
            <div side>
                <app-image img="assets/Milo/newni2.png" alt="Référence" artist="Newni"></app-image>
            </div>
            <div content>
                <app-bulletlist titre="FORME FÉLINE" [items]="[
                    
                    ]">
                </app-bulletlist>
            </div>
        </app-flexbox>
    </div>
</app-langtab>
