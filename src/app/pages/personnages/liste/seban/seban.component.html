<app-backarrow></app-backarrow>
<app-popup [warningIds]="[]"></app-popup>
<app-image img="assets/Seban/newni.png" alt="header" artist="Newni"></app-image>

<app-langtab>
    <div lang-en>
        <app-encadre age="Ageless" size="None" 
            desc="Seban is a deity of the Félicie cult representing cold, travel, souls at the border between this world and the afterlife, and bravery. He is the ferryman between this world and the hereafter, guiding souls toward Na, the deity of death and the dead.">
        </app-encadre>
        <app-bulletlist titre="MAGIC" [items]="[
            'Seban brings cold all around him. It is said that his long legs and magical hooves allow him to traverse whole regions in just a few steps.',
            ]">
        </app-bulletlist>
        <app-bulletlist titre="NOTES" [items]="[
            'Seban can guide lost travelers. In certain regions, he is likened to a shepherd.', 
            'Seban is a figure of bravery: he leads the march without faltering, through all weather and for all time.',
            'Seban is often referred to as the king of spirits.'
            ]">
        </app-bulletlist>
        <app-bulletlist titre="IDEAS" [items]="[
            'Any symbolic representation is welcome.', 
            'As a deity, people regularly represent Seban in their everyday objects: a painted plate, an ornate shepherd\'s crook, decorated clothing...'
            ]">
        </app-bulletlist>
        <br>
        <app-flexbox sidePosition="left">
            <div side>
                <app-image img="assets/Seban/newni2.png" alt="Référence" artist="Newni"></app-image>
            </div>
            <div content>
                <app-bulletlist titre="USUAL DESIGN" [items]="[
                    'Seban has white markings on his skin.',
                    'Seban is an idea more than a flesh-and-blood being, and their appearance may vary slightly depending on the region. You are therefore free to alter the design as long as you keep their antlers, rather short, and long deer legs ; and his pale colors, possibly a reference to the cold.'
                    ]">
                </app-bulletlist>
            </div>
        </app-flexbox>
    </div>

    <div lang-fr>
        <app-encadre age="Éternel" size="Aucune" 
            desc="Seban est une divinité du culte de Félicie représentant le froid, le voyage, les âmes à la frontière entre ce monde et l'au-delà et la bravoure. C'est le passeur entre ce monde et l'au-delà, il guide les âmes vers Na, divinité de la mort et des morts.">
        </app-encadre>
        <app-bulletlist titre="MAGIE" [items]="[
            'Seban apporte le froid autour de lui. Ses longues pattes et ses sabots magiques lui permettent de traverser des contrées en quelques pas, dit-on.',
            ]">
        </app-bulletlist>
        <app-bulletlist titre="NOTES" [items]="[
            'Seban peut guider les voyageurs égarés. Dans certaines régions, on l\'apparente à un berger.', 
            'Seban est une figure de bravoure : il mène la marche sans faillir par tous les temps, de tout temps.',
            'Seban est souvent désigné comme le roi des esprits.'
            ]">
        </app-bulletlist>
        <app-bulletlist titre="IDÉES" [items]="[
            'Toutes les représentations symboliques sont les bienvenues.', 
            'En tant que divinité, les gens représentent régulièrement Seban dans leurs objets du quotidien : une assiette peinte, un bâton de berger orné, un vêtement décoré, ...'
            ]">
        </app-bulletlist>
        <br>
        <app-flexbox sidePosition="left">
            <div side>
                <app-image img="assets/Seban/newni2.png" alt="Référence" artist="Newni"></app-image>
            </div>
            <div content>
                <app-bulletlist titre="FORME USUELLE" [items]="[
                    'Seban a des marques blanches sur sa peau.',
                    'Seban est une idée plus qu\'un être de chair et de sang, et son apparence peut varier légèrement selon les régions. Vous êtes donc libre de modifier le design tant que vous gardez ses bois, plutôt courts, et ses longues pattes de cerf ; et ses couleurs pâles, éventuellement en référence au froid.'
                    ]">
                </app-bulletlist>
            </div>
        </app-flexbox>
    </div>
</app-langtab>

<app-image img="assets/Seban/newni.png" alt="header" artist="Newni"></app-image>
