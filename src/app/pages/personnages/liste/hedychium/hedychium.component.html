<app-backarrow></app-backarrow>
<app-popup [warningIds]="[]"></app-popup>
<app-image img="assets/Hedychium/newni2.png" alt="header" artist="Newni"></app-image>

<app-langtab>
    <div lang-en>
        <app-encadre age="Ageless" size="None" 
            desc="Hedychium is a deity of the Félicie cult representing wild nature, hunting and gathering, as well as fauna, fungi and flora. They protect living beings.">
        </app-encadre>
        <app-bulletlist titre="MAGIC" [items]="[
            'Hedychium can grow entire forests or bring life back to desolate wastelands.',
            'They can communicate with all living beings, including plants and fungi.',
            ]">
        </app-bulletlist>
        <app-bulletlist titre="NOTES" [items]="[
            'Hedychium is a fierce and cruel deity, reflecting the harshness of wild nature. They only give to those who know how to survive.', 
            'Hedychium enjoys the company of animals and protects them.',
            'It is said that they are several meters tall and takes the form of a giant wolf with broad bat wings and a long scaly tail.'
            ]">
        </app-bulletlist>
        <app-bulletlist titre="IDEAS" [items]="[
            'Any symbolic representation is welcome.', 
            'As a deity, people regularly represent Hedychium in their everyday objects: a painted plate, an ornate knife, decorated clothing...'
            ]">
        </app-bulletlist>
        <br>
        <app-flexbox sidePosition="left">
            <div side>
                <app-image img="assets/Hedychium/newni.png" alt="Référence" artist="Newni"></app-image>
            </div>
            <div content>
                <app-bulletlist titre="USUAL DESIGN" [items]="[
                    'Their wings and tail are connected.',
                    'Hedychium is an idea more than a flesh-and-blood being, and their appearance may vary slightly depending on the region. You are therefore free to alter the design as long as you keep their canine shape, their tail, and their wings and their green color and their orange-toned extremities.'
                    ]">
                </app-bulletlist>
            </div>
        </app-flexbox>
    </div>

    <div lang-fr>
        <app-encadre age="Éternel" size="Aucune" 
            desc="Hedychium est une divinité du culte de Félicie représentant la nature sauvage, la chasse et la cueillette, la faune, les fonges et la flore. Hedychium protège les êtres vivants.">
        </app-encadre>
        <app-bulletlist titre="MAGIE" [items]="[
            'Hedychium peut faire pousser des forêts ou apporter la vie aux terres désolées.', 
            'Hedychium peut communiquer avec tous les êtres vivants, y compris les plantes et les fonges.',
            ]">
        </app-bulletlist>
        <app-bulletlist titre="NOTES" [items]="[
            'Hedychium est une divinité féroce et cruelle, à l\'image de la nature sauvage. Hedychium ne donne qu\'à celleux qui savent survivre.', 
            'Hedychium apprécie la compagnie des animaux et les protège des chasseurs.',
            'Il est dit que cette divinité fait plusieurs mètres de haut, qu\'elle est un loup géant avec de larges ailes de chauve-souris et une longue queue écailleuse.'
            ]">
        </app-bulletlist>
        <app-bulletlist titre="IDÉES" [items]="[
            'Toutes les représentations symboliques sont les bienvenues.', 
            'En tant que divinité, les gens représentent régulièrement Hedychium dans leurs objets du quotidien : une assiette peinte, un couteau orné, un vêtement décoré, ...'
            ]">
        </app-bulletlist>
        <br>
        <app-flexbox sidePosition="left">
            <div side>
                <app-image img="assets/Hedychium/newni.png" alt="Référence" artist="Newni"></app-image>
            </div>
            <div content>
                <app-bulletlist titre="FORME USUELLE" [items]="[
                    'Ses ailes et sa queue sont reliées.', 
                    'Hedychium est une idée plus qu\'un être de chair et de sang, et son apparence peut varier légèrement selon les régions. Vous êtes donc libre de modifier le design tant que vous gardez sa forme canine, sa queue, ses ailes et sa couleur verte avec des extrémités orangées'
                    ]">
                </app-bulletlist>
            </div>
        </app-flexbox>
    </div>
</app-langtab>

<app-image img="assets/Hedychium/newni2.png" alt="header" artist="Newni"></app-image>
