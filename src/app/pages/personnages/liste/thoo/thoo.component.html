<app-backarrow></app-backarrow>
<app-popup [warningIds]="[]"></app-popup>
<app-image img="assets/Thoo/MadPixelle.gif" alt="header" artist="MadPixelle"></app-image>

<app-langtab>
    <div lang-en>
        <app-encadre age="17 years old" size="5.1 ft" 
            desc="Thoo has been living at the orphanage since she was twelve. She has been hiding among humans ever since Médien saved and took her in. She will soon have to leave the orphanage and is hesitating between returning to live as a dragon or accepting the job offer from the herbalist shop.">
        </app-encadre>
        <app-bulletlist titre="MAGIC" [items]="[
            'Her magic allows her to accelerate the growth of plants (she cannot create plants). Her power is useless in sterile areas. She can use it in her human form without any issues.'
            ]">
        </app-bulletlist>
        <app-bulletlist titre="NOTES" [items]="[
            'Thoo is very curious; she sometimes asks indiscreet questions, especially since she did not grow up with a human filter.', 
            'Thoo is intelligent and understands quickly. This allows her to adapt well. However, she is very stubborn.',
            'Thoo is nervous and highly suspicious of strangers. Her responses can be aggressive or abrupt. She regularly goes through periods of hypervigilance and anxiety attacks.',
            'Thoo handles her emotions poorly; she is easy to read but hard to make talk. Thoo is proud, like the majority of her peers.'
            ]">
        </app-bulletlist>
        <app-bulletlist titre="IDEAS" [items]="[
            'Thoo observing the starry sky with sadness. She is likely reminiscing about her life as a dragon.', 
            'Thoo discovering a dish she has never eaten before. She enjoys human food.',
            'Thoo throwing a temper tantrum.'
            ]">
        </app-bulletlist>
        <br>
        <app-flexbox sidePosition="left">
            <div side>
                <app-image img="assets/Thoo/DaffyDandy.png" alt="Référence" artist="DaffyDandy"></app-image>
            </div>
            <div content>
                <app-bulletlist titre="DRAGON FORM" [items]="[
                    'In her dragon form, Thoo has antlers on her head and at the base of her tail.'
                    ]">
                </app-bulletlist>
            </div>
        </app-flexbox>
        <app-flexbox sidePosition="left">
            <div side>
                <app-image img="assets/Thoo/Shauku.png" alt="Référence" artist="Shauku"></app-image>
            </div>
            <div content>
                <app-bulletlist titre="HUMAN FORM" [items]="[
                    'Thoo rarely lets her hair down, but it can happen.'
                    ]">
                </app-bulletlist>
            </div>
        </app-flexbox>
                <app-flexbox sidePosition="left">
            <div side>
                <app-image img="assets/Thoo/newni2.png" alt="Référence" artist="newni"></app-image>
            </div>
            <div content>
                <app-bulletlist titre="HUMAN FORM - 11 yo" [items]="[
                    'When she was 11 years old, she wasn\'t used to her human form yet. She was leaving her hair down as a bushy mane.',
                    'She wasn\'t at the orphanage yet.'
                    ]">
                </app-bulletlist>
            </div>
        </app-flexbox>
    </div>

    <div lang-fr>
        <app-encadre age="17 ans" size="156 cm" 
            desc="Thoo vit à l'orphelinat depuis ses douze ans. Elle se cache parmi les humains depuis que Médien l'a sauvée et recueillie. Elle va bientôt devoir quitter l'orphelinat et elle hésite entre retourner vivre comme dragon ou accepter l'offre d'embauche de l'herboristerie.">
        </app-encadre>
        <app-bulletlist titre="MAGIE" [items]="[
            'Sa magie lui permet d\'accélérer la croissance des plantes (elle ne peut pas créer de plantes). Son pouvoir est inutile en zone stérile. Elle peut l’utiliser sous forme humaine sans problème.'
            ]">
        </app-bulletlist>
        <app-bulletlist titre="NOTES" [items]="[
            'Thoo est très curieuse, il lui arrive de poser des questions indiscrètes, d\'autant plus qu\'elle n\'a pas grandi avec le filtre humain.', 
            'Thoo est intelligente et comprend vite. Cela lui permet de s\'adapter. Elle est cependant très têtue.',
            'Thoo est nerveuse et très méfiante des inconnus. Ses réponses peuvent être agressives ou brusques. Elle passe régulièrement par des périodes d\'hypervigilance et des crises d\'angoisse.',
            'Thoo contrôle mal ses émotions, elle est facile à lire mais difficile à faire parler. Thoo est fière, comme la majorité de ses congénères.'
            ]">
        </app-bulletlist>
        <app-bulletlist titre="IDÉES" [items]="[
            'Thoo observe le ciel étoilé avec tristesse. Elle repense sans doute à sa vie de dragon.', 
            'Thoo découvre un plat qu\'elle n\'a jamais mangé auparavant. Elle apprécie la cuisine humaine.',
            'Thoo en train de piquer une crise de colère.'
            ]">
        </app-bulletlist>
        <br>
        <app-flexbox sidePosition="left">
            <div side>
                <app-image img="assets/Thoo/DaffyDandy.png" alt="Référence" artist="DaffyDandy"></app-image>
            </div>
            <div content>
                <app-bulletlist titre="DRAGON" [items]="[
                    'Sous sa forme de dragon, Thoo a des bois sur sa tête et à la base de sa queue.'
                    ]">
                </app-bulletlist>
            </div>
        </app-flexbox>
        <app-flexbox sidePosition="left">
            <div side>
                <app-image img="assets/Thoo/Shauku.png" alt="Référence" artist="Shauku"></app-image>
            </div>
            <div content>
                <app-bulletlist titre="HUMAINE" [items]="[
                    'Thoo se détache rarement les cheveux, mais cela peut arriver.'
                    ]">
                </app-bulletlist>
            </div>
        </app-flexbox>
                <app-flexbox sidePosition="left">
            <div side>
                <app-image img="assets/Thoo/newni2.png" alt="Référence" artist="newni"></app-image>
            </div>
            <div content>
                <app-bulletlist titre="HUMAINE - 11 ans" [items]="[
                    'Lorsqu\'elle avait 11 ans, elle n\'était pas encore habituée à sa forme humaine. Elle laissait ses cheveux détachés en une crinière touffue.',
                    'Elle n\'était pas encore à l\'orphelinat.'
                    ]">
                </app-bulletlist>
            </div>
        </app-flexbox>
    </div>
</app-langtab>

<app-image img="assets/Thoo/MadPixelle.gif" alt="header" artist="MadPixelle"></app-image>
