<app-langtab>
    <div lang-en>
        <app-encadre age="20 years old" size="5.6 ft" 
            desc="Verveine lives and works at the herbalist shop. He is in a relationship with Buster.">
        </app-encadre>
        <app-bulletlist titre="MAGIC" [items]="[
            'Verveine does not possess any particular magic.'
            ]">
        </app-bulletlist>
        <app-bulletlist titre="NOTES" [items]="[
            'Verveine is discreet and reserved. He avoids conflicts as much as possible.', 
            'Verveine appears patient and calm, but he is very good at hiding his worries. Thus, he does his best to stay in his comfort zone. He aspires to live a quiet, simple life.',
            'When he is comfortable, he can be cheerful or even make little jokes. He can show a particularly affectionate side, which he is usually rather ashamed of.'
            ]">
        </app-bulletlist>
        <app-bulletlist titre="IDEAS" [items]="[
            'Verveine taking care of the garden or preparing a decoction.', 
            'Verveine showing a tip or a recipe to Félix.',
            'Verveine and Silène spending a quiet moment together, or confiding in one another.',
            'Verveine, asleep, by the fireside.'
            ]">
        </app-bulletlist>
        <br>
        <app-flexbox sidePosition="left">
            <div side>
                <app-image img="assets/Verveine/newni.png" alt="Référence" artist="Newni"></app-image>
            </div>
            <div content>
                <app-bulletlist titre="FERAL FORM" [items]="[
                    'Verveine lives in symbiosis with a plant. He must adapt his clothes to leave it uncovered to the open air.', 
                    'Verveine has been blind in one eye since birth. He has freckles. Verveine has no tail, neither in human form nor in feline form.'
                    ]">
                </app-bulletlist>
            </div>
        </app-flexbox>
    </div>

    <div lang-fr>
        <app-encadre age="20 ans" size="169 cm" 
            desc="Verveine vit et travaille à l'herboristerie. Il est en couple avec Buster.">
        </app-encadre>
        <app-bulletlist titre="MAGIE" [items]="[
            'Verveine n\'a pas de magie particulière.'
            ]">
        </app-bulletlist>
        <app-bulletlist titre="NOTES" [items]="[
            'Verveine est quelqu\'un de discret et réservé. Il évite au maximum les conflits.', 
            'Verveine semble patient et calme mais il est très doué pour cacher ses inquiétudes. Ainsi, il fait son possible pour rester dans sa zone de confort. Il aspire à vivre une petite vie tranquille.',
            'Quand il est en confiance, il peut se montrer jovial, voire faire des petites blagues. Il peut se montrer particulièrement affectueux, ce dont il a plutôt honte en temps normal.'
            ]">
        </app-bulletlist>
        <app-bulletlist titre="IDÉES" [items]="[
            'Verveine s’occupe du jardin ou prépare une décoction.',
            'Verveine montre une astuce ou une recette à Félix.',
            'Verveine et Silène passent un moment tranquille ensemble, ou se confient l’un à l\'autre.',
            'Verveine, endormi, au coin de la cheminée.'
            ]">
        </app-bulletlist>
        <br>
        <app-flexbox sidePosition="left">
            <div side>
                <app-image img="assets/Verveine/newni.png" alt="Référence" artist="Newni"></app-image>
            </div>
            <div content>
                <app-bulletlist titre="FORME FÉLINE" [items]="[
                    'Verveine vit en symbiose avec une plante. Il doit adapter ses vêtements pour la laisser à l\'air libre.',
                    'Verveine est borgne depuis sa naissance. Il a des taches de rousseur. Verveine n\'a pas de queue, ni sous forme humaine, ni sous forme féline.'
                    ]">
                </app-bulletlist>
            </div>
        </app-flexbox>
    </div>
</app-langtab>
