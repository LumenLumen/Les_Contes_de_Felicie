<app-langtab>
    <div lang-en>
        <app-encadre age="31 years old" size="5.9 ft" 
            desc="Grimgrim works at the herbalist shop and was the very first employee of the boutique. She alternates between preparing remedies for sale, handling customers, and treating patients.">
        </app-encadre>
        <app-bulletlist titre="MAGIC" [items]="[
            'Grimgrim does not possess any particular magic.'
            ]">
        </app-bulletlist>
        <app-bulletlist titre="NOTES" [items]="[
            'Grimgrim is headstrong and won\'t let anyone walk all over her. She is a fighter who does what she believes is right, and she can regularly put her foot in her mouth.', 
            'Smiling and cheerful, she is rather pleasant to be around. She is someone who always has energy to spare.'
            ]">
        </app-bulletlist>
        <app-bulletlist titre="IDEAS" [items]="[
            'Grimgrim and Verveine talking; they are very close because they both suffered the same violence in the past.', 
            'Grimgrim reading, which is her main activity during her free time. She sometimes writes her own stories too.',
            'Grimgrim preparing food. People eat a lot of fish in Félicie.'
            ]">
        </app-bulletlist>
        <br>
        <app-flexbox sidePosition="left">
            <div side>
                <app-image img="assets/Grimgrim/TheGreenPlant.png" alt="Référence" artist="TheGreenPlant"></app-image>
            </div>
            <div content>
                <app-bulletlist titre="DAILY OUTFIT" [items]="[
                    'Grimgrim lives in symbiosis with the plants growing on her body.', 
                    'Grimgrim only has four digits per limb (fingers and toes).',
                    'Grimgrim\'s hair is made of seaweed. She must hydrate it regularly. When it gets very hot or dry, she can tie it up into a bun so that it preserves its moisture longer.',
                    'You can change her outfit or her accessories, but her plants must remain as visible as possible!'
                    ]">
                </app-bulletlist>
            </div>
        </app-flexbox>
    </div>

    <div lang-fr>
        <app-encadre age="31 ans" size="175cm" 
            desc="Grimgrim travaille à l'herboristerie, c'est la première employée de la boutique. Grimgrim alterne entre la mise en vente des remèdes, la vente et le soin des patients.">
        </app-encadre>
        <app-bulletlist titre="MAGIE" [items]="[
            'Grimgrim n\'a pas de magie particulière.'
            ]">
        </app-bulletlist>
        <app-bulletlist titre="NOTES" [items]="[
            'Grimgrim est une forte tête qui ne se laisse pas marcher sur les pieds. C\'est une battante qui fait ce qui lui semble juste, et elle peut mettre régulièrement les pieds dans le plat.', 
            'Souriante et gaie, elle est plutôt agréable à côtoyer. C\'est quelqu\'un qui a de l\'énergie à revendre.'
            ]">
        </app-bulletlist>
        <app-bulletlist titre="IDÉES" [items]="[
            'Grimgrim et Verveine en train de discuter, ils sont proches tous les deux car ils ont subi des violences similaires par le passé.', 
            'Hegal espionne une conversation, invisible aux yeux des autres.',
            'Grimgrim en train de lire, son activité principale sur son temps libre. Elle écrit elle-même parfois.',
            'Grimgrim en train de se préparer à manger. On mange beaucoup de poisson à Félicie.'
            ]">
        </app-bulletlist>
        <br>
        <app-flexbox sidePosition="left">
            <div side>
                <app-image img="assets/Grimgrim/TheGreenPlant.png" alt="Référence" artist="TheGreenPlant"></app-image>
            </div>
            <div content>
                <app-bulletlist titre="TENUE QUOTIDIENNE" [items]="[
                    'Grimgrim vit en symbiose avec les plantes qui poussent sur son corps.', 
                    'Grimgrim n\'a que quatre doigts par membre (mains et pieds).',
                    'Les cheveux de Grimgrim sont des algues. Elle doit les hydrater régulièrement. Quand il fait très chaud ou sec, elle peut les attacher en chignon pour qu\'elles préservent leur humidité plus longtemps.',
                    'Vous pouvez changer sa tenue ou ses accessoires, mais ses plantes doivent rester le plus visibles possible'
                    ]">
                </app-bulletlist>
            </div>
        </app-flexbox>
    </div>
</app-langtab>
