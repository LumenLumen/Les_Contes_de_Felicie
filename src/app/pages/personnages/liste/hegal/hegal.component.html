<app-backarrow></app-backarrow>
<app-popup [warningIds]="[]"></app-popup>
<app-image img="assets/Hegal/fyrenos.png" alt="header" artist="fyrenos"></app-image>

<app-langtab>
    <div lang-en>
        <app-encadre age="23 years old" size="4.0 ft" 
            desc="Hegal is Ezer's adoptive sister. She is a chimera who has been helping her mother Hene, the queen of the chimeras, through espionage and intelligence gathering for a few years now.">
        </app-encadre>
        <app-bulletlist titre="MAGIC" [items]="[
            'Hegal communicates through telepathy, like all of her kind.',
            'She can turn herself invisible, along with anyone who is in contact with her.'
            ]">
        </app-bulletlist>
        <app-bulletlist titre="NOTES" [items]="[
            'Hegal is serious and cautious. She rarely smiles and readily bares her fangs. She is solitary and protective.', 
            'Hegal hates her appearance and often prefers to remain invisible.',
            'Hegal took care of Ezer and traveled with him from the age of six to sixteen. They are extremely close, although they separated painfully at Hegal\'s initiative. Today, they follow different paths.',
            'Hegal loves to wander around; it helps her keep her mind clear.'
            ]">
        </app-bulletlist>
        <app-bulletlist titre="IDEAS" [items]="[
            'Hegal in an inaccessible, rugged, or particularly idyllic landscape.', 
            'Hegal spying on a conversation, invisible to the eyes of others.',
            'Hegal hunting for food. She is a carnivore.'
            ]">
        </app-bulletlist>
        <br>
        <app-flexbox sidePosition="left">
            <div side>
                <app-image img="assets/Hegal/Nholae.png" alt="Référence" artist="Nholae"></app-image>
            </div>
            <div content>
                <app-bulletlist titre="USUAL DESIGN" [items]="[
                    'Hegal is a mix between a parrot, a tiger, a lion, a frog, and a snake. She has a small horn on her nose.', 
                    'Do not draw her with a big smile; she is rather serious or gloomy.',
                    'Her back paws are frogs paws, please do not draw her with canine/feline articulations.'
                    ]">
                </app-bulletlist>
            </div>
        </app-flexbox>
        <app-flexbox sidePosition="left">
            <div side>
                <app-image img="assets/Hegal/fyrenos2.png" alt="Référence" artist="fyrenos"></app-image>
            </div>
            <div content>
                <app-bulletlist titre="MOVEMENT" [items]="[
                    'Hegal cannot stand as shown in the reference above, frog legs are not made to support the weight of a body. She mostly stands just as a frog.', 
                    'She can jump as a frog and usually uses this ability to start a flight.'
                    ]">
                </app-bulletlist>
            </div>
        </app-flexbox>
    </div>

    <div lang-fr>
        <app-encadre age="23 ans" size="122cm" 
            desc="Hegal est la sœur adoptive d'Ezer. C'est une chimère qui aide sa mère Hene, la reine des chimères, par de l'espionnage et de la prise d'informations depuis quelques années.">
        </app-encadre>
        <app-bulletlist titre="MAGIE" [items]="[
            'Hegal communique par télépathie, comme tous ses semblables.', 
            'Elle peut se rendre invisible, elle ainsi que tout ceux qui sont à son contact.'
            ]">
        </app-bulletlist>
        <app-bulletlist titre="NOTES" [items]="[
            'Hegal est sérieuse et prudente. Elle sourit rarement et montre volontiers les crocs. Elle est solitaire et protectrice.', 
            'Hegal déteste son apparence et préféra bien souvent rester invisible.',
            'Hegal s\'est occupée d\'Ezer et a voyagé avec lui de ses six à ses seize ans. Ils sont extrêmement proches, bien qu\'ils se soient séparés dans la douleur à l\'initiative de Hegal. Aujourd\'hui, ils poursuivent des routes différentes.',
            'Hegal aime beaucoup vagabonder, cela l\'aide à garder l\'esprit clair.'
            ]">
        </app-bulletlist>
        <app-bulletlist titre="IDÉES" [items]="[
            'Hegal dans un paysage inaccessible, escarpé ou particulièrement idyllique.', 
            'Hegal espionne une conversation, invisible aux yeux des autres.',
            'Hegal chasse pour se nourrir. Elle est carnivore.'
            ]">
        </app-bulletlist>
        <br>
        <app-flexbox sidePosition="left">
            <div side>
                <app-image img="assets/Hegal/Nholae.png" alt="Référence" artist="Nholae"></app-image>
            </div>
            <div content>
                <app-bulletlist titre="FORME USUELLE" [items]="[
                    'Hegal est un mixte entre un perroquet, un tigre, un lion, une grenouille et un serpent. Elle possède une petite corne sur le nez.', 
                    'Ne la dessinez pas avec un grand sourire, elle est plutôt sérieuse ou morose.',
                    'Ses pattes arrières sont des pattes de grenouille, ne la dessinez pas avec des articulations de félins/canins.'
                    ]">
                </app-bulletlist>
            </div>
        </app-flexbox>
        <app-flexbox sidePosition="left">
            <div side>
                <app-image img="assets/Hegal/fyrenos2.png" alt="Référence" artist="fyrenos"></app-image>
            </div>
            <div content>
                <app-bulletlist titre="MOUVEMENT" [items]="[
                    'Hegal ne peut pas se tenir debout comme montré dans la référence ci-dessus, les pattes de grenouille ne sont pas faites pour supporter le poids d\'un corps. Elle se tient comme une grenouille.', 
                    'Elle peut sauter comme une grenouille et utilise généralement cette capacité pour s\'envoler.'
                    ]">
                </app-bulletlist>
            </div>
        </app-flexbox>
    </div>
</app-langtab>

<app-image img="assets/Hegal/fyrenos.png" alt="header" artist="fyrenos"></app-image>
