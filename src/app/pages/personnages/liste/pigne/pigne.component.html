<app-backarrow></app-backarrow>
<app-popup [warningIds]="[]"></app-popup>
<app-image img="assets/Pigne/newni.gif" alt="header" artist="Newni"></app-image>

<app-langtab>
    <div lang-en>
        <app-encadre age="5 years old" size="3.3 ft" 
            desc="An orphan, Pigné is the mascot of the orphanage. He hatched from an abandoned egg that was brooded by Ezer and was born malformed. Those of his species normally have wings, but only the joints remain on Pigné. He has lived at the orphanage since he was very small and loves it there.">
        </app-encadre>
        <app-bulletlist titre="MAGIC" [items]="[
            'Pigné can crystallize the surrounding ambient magic through his appendages. The tip actually contains a forming crystal. When the crystal is large enough, it gradually slips out of the appendage, which is painless for Pigné, and a new one begins to form. These crystals emit a faint light and change color based on his emotions.'
            ]">
        </app-bulletlist>
        <app-bulletlist titre="NOTES" [items]="[
            'Pigné is a joyful and playful little creature. He is a good companion and understands human language quite well after all this time.', 
            'Pigné acts as a sort of gauge for the orphanage staff: the color of his crystals is a great indicator of the overall mood and atmosphere.',
            'In autumn, Pigné cannot help but scatter every single pile of dead leaves he sees. He just can\'t control it.',
            'Pigné enjoys chewing on all sorts of things, especially pebbles, rocks, and minerals of any kind.',
            'Pigné makes no noise and has no cry. On rare occasions, he can be heard growling, but that is the only sound he ever produces.'
            ]">
        </app-bulletlist>
        <app-bulletlist titre="IDEAS" [items]="[
            'Pigné playing with the children of the orphanage. He gets along well with everyone, except perhaps Ozzilon, who tends to give him a hard time.', 
            'Pigné making sweet eyes to beg for food scraps.',
            'Pigné rolling on the ground, belly up, asking for belly scratches.',
            'Pigné trying to eat the stone wall of a house.'
            ]">
        </app-bulletlist>
        <br>
        <app-flexbox sidePosition="left">
            <div side>
                <app-image img="assets/Pigne/Nholae.png" alt="Référence" artist="Nholae"></app-image>
            </div>
            <div content>
                <app-bulletlist titre="USUAL DESIGN" [items]="[
                    'Do not represent Pigné with a color that does not match his current emotion! If you are unsure, feel free to ask.',
                    'Pigné has very thin scales. When he was born, his scales were almost transparent, but they have thickened over time.',
                    'You are free to add accessories to Pigné; I can easily imagine the orphanage residents having fun dressing him up on occasion.'
                    ]">
                </app-bulletlist>
            </div>
        </app-flexbox>
        <app-flexbox sidePosition="left">
            <div side>
                <app-image img="assets/Pigne/Nholae2.png" alt="Référence" artist="Nholae"></app-image>
            </div>
            <div content>
                <app-bulletlist titre="LIGHTS REF" [items]="[
                    'Colorful parts on Pigné\'s body are the parts that emit a slight light.',
                    ]">
                </app-bulletlist>
            </div>
        </app-flexbox>
    </div>

    <div lang-fr>
        <app-encadre age="5 ans" size="100 cm" 
            desc="Orphelin, Pigné est la mascotte de l'orphelinat. Il est issu d'un œuf abandonné qui a été couvé par Ezer puis est né malformé. Ceux de son espèce ont normalement des ailes, mais il n'en reste que l'articulation chez Pigné. Il vit à l'orphelinat depuis tout petit et s'y plaît.">
        </app-encadre>
        <app-bulletlist titre="MAGIE" [items]="[
            'Pigné peut cristalliser la magie ambiante via ses appendices. L\'extrémité contient en réalité un cristal en formation. Quand le cristal est suffisamment gros, il se glisse progressivement hors de l\'appendice, ce qui est indolore pour Pigné, et un nouveau se forme. Ces cristaux émettent une petite lumière. Ces cristaux changent de couleur selon ses émotions.'
            ]">
        </app-bulletlist>
        <app-bulletlist titre="NOTES" [items]="[
            'Pigné est une petite créature joyeuse et joueuse. C\'est un bon compagnon et il comprend assez bien le langage humain à force.', 
            'Pigné est une sorte de sonde pour le personnel de l\'orphelinat : la couleur des cristaux de Pigné est un bon indicateur de l\'ambiance.',
            'À l\'automne, Pigné ne peut pas s\'empêcher de disperser tous les tas de feuilles mortes qu\'il voit. C\'est plus fort que lui.',
            'Pigné apprécie mâchouiller tout un tas de trucs et notamment les cailloux, les pierres et les minéraux en tout genre.',
            'Pigné ne fait pas de bruit, il n\'a pas de cri. Rarement, on peut l\'entendre grogner, mais c\'est le seul son qu\'il produit.'
            ]">
        </app-bulletlist>
        <app-bulletlist titre="IDÉES" [items]="[
            'Pigné joue avec les enfants de l\'orphelinat. Il s\'entend bien avec tout le monde, sauf peut-être Ozzilon qui a tendance à lui faire des misères.', 
            'Pigné fait les yeux doux pour réclamer des restes de nourriture.',
            'Pigné se roule au sol, le ventre à l\'air, pour réclamer des gratouilles.',
            'Pigné essaie de grignoter des cailloux.'
            ]">
        </app-bulletlist>
        <br>
        <app-flexbox sidePosition="left">
            <div side>
                <app-image img="assets/Pigne/Nholae.png" alt="Référence" artist="Nholae"></app-image>
            </div>
            <div content>
                <app-bulletlist titre="DESIGN USUEL" [items]="[
                    'Ne représentez pas Pigné avec une couleur qui ne correspond pas à son émotion du moment ! Si vous avez un doute, n\'hésitez pas à demander.',
                    'Pigné a des écailles très fines. À sa naissance, ses écalles étaient presque transparentes, mais elles se sont épaissies avec le temps.',
                    'Vous êtes libre d\'ajouter des accessoires à Pigné ; j\'imagine bien les pensionnaires de l\'orphelinat s\'amuser à le déguiser de temps en temps.'
                    ]">
                </app-bulletlist>
            </div>
        </app-flexbox>
        <app-flexbox sidePosition="left">
            <div side>
                <app-image img="assets/Pigne/Nholae2.png" alt="Référence" artist="Nholae"></app-image>
            </div>
            <div content>
                <app-bulletlist titre="LUMIÈRES" [items]="[
                    'Les parties colorées du corps de Pigné sont les parties qui émettent une légère lumière.',
                    ]">
                </app-bulletlist>
            </div>
        </app-flexbox>
    </div>
</app-langtab>
